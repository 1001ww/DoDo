<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<title>DoDo 速记球</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* ================= 主题变量(与主窗一致) ================= */
:root{
  --primary:#5B5BD6; --primary-h:#4C4CC4; --primary-soft:rgba(91,91,214,.10); --ring:0 0 0 3px rgba(91,91,214,.15);
  --bg:#F4F4F8; --surface:#FFFFFF; --surface-2:#F7F7FA; --surface-3:#F1F1F6;
  --text-1:#21212B; --text-2:#6F6F7C; --text-3:#A4A4B0;
  --border:#E9E9F0; --border-2:#F0F0F5;
  --red:#E5484D; --red-soft:rgba(229,72,77,.10);
  --orange:#F5A524; --blue:#4A9EF5; --green:#30A46C; --green-soft:rgba(48,164,108,.12);
  --shadow-2:0 8px 30px rgba(18,18,28,.14);
  --glass:rgba(255,255,255,.62); --glass-brd:rgba(255,255,255,.55);
}
[data-theme="dark"]{
  --primary:#8484F0; --primary-h:#9797F4; --primary-soft:rgba(132,132,240,.14); --ring:0 0 0 3px rgba(132,132,240,.20);
  --bg:#16161B; --surface:#1E1E25; --surface-2:#23232B; --surface-3:#2A2A34;
  --text-1:#ECECF1; --text-2:#9A9AA6; --text-3:#60606C;
  --border:#2C2C36; --border-2:#26262F;
  --red:#F26D72; --red-soft:rgba(242,109,114,.14);
  --orange:#F5A524; --blue:#5AA9F7; --green:#3DBA7A; --green-soft:rgba(61,186,122,.16);
  --shadow-2:0 8px 30px rgba(0,0,0,.5);
  --glass:rgba(30,30,37,.55); --glass-brd:rgba(255,255,255,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:"Noto Sans SC","Microsoft YaHei UI","PingFang SC","Segoe UI",system-ui,sans-serif;
  font-size:14px;line-height:1.6;color:var(--text-1);-webkit-font-smoothing:antialiased;user-select:none}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;font-size:inherit}
input{font-family:inherit;font-size:inherit;color:inherit;border:none;outline:none;background:transparent}
.ic{flex:none;display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(128,128,150,.25);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ================= 悬浮球(窗口 62×62,球 54 居中) ================= */
.ball{position:absolute;left:4px;top:4px;width:54px;height:54px;border-radius:50%;
  background:radial-gradient(120% 120% at 30% 22%,#8B8BFF 0%,var(--primary) 46%,var(--primary-h) 100%);
  box-shadow:inset 0 1px 1.5px rgba(255,255,255,.38),inset 0 -2px 4px rgba(30,30,80,.18);
  display:flex;align-items:center;justify-content:center;color:#fff;cursor:grab;
  transition:opacity .25s ease,transform .25s ease;
  animation:ballIn .5s cubic-bezier(.34,1.4,.64,1) both}
@keyframes ballIn{from{opacity:0;transform:scale(.3)}}
.ball.docked{opacity:.68;transform:scale(.94)}
.ball.docked:hover{opacity:1;transform:scale(1.07)}
.ball.dragging{opacity:1;transform:scale(1.1);cursor:grabbing;
  box-shadow:inset 0 1px 1.5px rgba(255,255,255,.38),inset 0 -2px 4px rgba(30,30,80,.18);transition:none}
.ball.pulse{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.9)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
/* 贴边收纳:球元素向屏幕边平移(窗口不动,点击稳定) */
.ball.peek{opacity:.55;transform:scale(.88) translateX(var(--peekdx,20px))}
.ball.peek:hover{opacity:1;transform:scale(1) translateX(0)}
#ballIco{display:flex;flex-direction:column;align-items:center}
.ball .bnum{font-size:19px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.ball .blab{font-size:8.5px;font-weight:600;opacity:.85;letter-spacing:1.5px;margin-right:-1.5px;line-height:1;margin-top:1px}
.ball .bring{position:absolute;inset:-4px;pointer-events:none}
.ball .bring .arc{transition:stroke-dashoffset .45s ease}
/* 贴边收纳:窗口整体移出,无单独样式 */

/* ================= 待办面板 ================= */
.panel{position:absolute;left:0;top:0;width:376px;border-radius:16px;overflow:hidden;
  background:var(--surface);box-shadow:var(--shadow-2),0 0 0 1px var(--border);
  padding:13px 13px 6px;opacity:0;pointer-events:none;
  transform:scale(.3);transition:transform .26s cubic-bezier(.34,1.45,.64,1),opacity .2s ease}
.panel.open{opacity:1;pointer-events:auto;transform:scale(1)}
.p-head{display:flex;align-items:center;gap:9px;margin:1px 3px 10px;cursor:grab}
.p-head.dragging{cursor:grabbing}
.p-head .logo{width:24px;height:24px;border-radius:8px;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;
  background:linear-gradient(145deg,#6E6EF0,var(--primary-h));box-shadow:0 2px 6px rgba(76,76,196,.4)}
.p-head .ht{font-size:14.5px;font-weight:700;line-height:1.3}
.p-head .hd{font-size:11px;color:var(--text-3);line-height:1.3}
.p-head .ring-wrap{position:relative;width:30px;height:30px;margin-left:auto;flex:none}
.p-head .ring-wrap svg{display:block}
.p-head .ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:var(--text-2);letter-spacing:-.3px}
.p-inputwrap{display:flex;align-items:center;gap:8px;background:var(--surface-2);
  border:1.5px solid transparent;border-radius:11px;padding:8px 11px;transition:all .18s;margin:0 2px}
.p-inputwrap:focus-within{background:var(--surface);border-color:var(--primary);box-shadow:var(--ring)}
.p-inputwrap .plus{color:var(--text-3);flex:none;display:flex}
.p-inputwrap input{flex:1;font-size:13px}
.p-inputwrap input::placeholder{color:var(--text-3)}
.p-chips{display:none;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 4px 0}
.p-chips.has{display:flex}
.chip{display:inline-flex;align-items:center;gap:4.5px;font-size:11.5px;font-weight:600;
  padding:2px 10px;border-radius:99px;white-space:nowrap;animation:chipIn .18s ease both}
@keyframes chipIn{from{opacity:0;transform:scale(.85)}}
.chip.date,.chip.time{background:var(--primary-soft);color:var(--primary)}
.chip.list{background:var(--green-soft);color:var(--green)}
.chip.tag{background:var(--surface-3);color:var(--text-2)}
.chip.prio3{background:var(--red-soft);color:var(--red)}
.chip.prio2{background:rgba(245,165,36,.13);color:var(--orange)}
.chip.prio1{background:rgba(74,158,245,.12);color:var(--blue)}
.p-list{max-height:342px;overflow-y:auto;margin:4px -4px 0;padding:0 4px}
.grp{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--text-2);
  padding:8px 6px 3px;position:sticky;top:0;background:var(--surface);z-index:2}
.grp .cnt{color:var(--text-3);font-weight:500}
.grp.over{color:var(--red)}
.trow{display:flex;align-items:center;gap:9px;padding:7px 6px;border-radius:9px;position:relative;
  transition:background .12s;animation:rowIn .22s ease both}
.p-list.noanim .trow,.p-list.noanim .donerow,.p-list.noanim .alldone{animation:none}
@keyframes rowIn{from{opacity:0;transform:translateY(-4px)}}
.trow:hover{background:var(--surface-2)}
.trow + .trow::before{content:"";position:absolute;top:0;left:33px;right:6px;height:1px;background:var(--border-2)}
.trow:hover + .trow::before,.trow:hover::before{opacity:0}
.checkbox{width:18px;height:18px;border:1.5px solid var(--text-3);border-radius:6px;flex:none;
  display:flex;align-items:center;justify-content:center;color:#fff;transition:all .18s;background:transparent;cursor:pointer}
.checkbox:hover{border-color:var(--primary)}
.checkbox svg path{stroke-dasharray:14;stroke-dashoffset:14;transition:stroke-dashoffset .25s ease .05s}
.checkbox.checked{background:var(--primary);border-color:var(--primary)}
.checkbox.checked svg path{stroke-dashoffset:0}
.tmain{flex:1;min-width:0;display:flex;align-items:center;gap:7px}
.ldot{width:7px;height:7px;border-radius:50%;flex:none}
.tt2{font-size:13.5px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.trow .tt2::after{content:"";position:absolute;left:0;top:55%;height:1.5px;width:0;background:var(--text-3);transition:width .3s ease}
.trow.finishing .tt2::after{width:100%}
.trow.finishing{opacity:.55}
.trow.collapsing{overflow:hidden;height:0!important;padding-top:0!important;padding-bottom:0!important;opacity:0;
  transition:height .24s ease,opacity .18s ease,padding .24s ease}
.tmeta{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-3);flex:none}
.tmeta .over{color:var(--red);font-weight:600}
.tmeta .rep{display:flex;align-items:center;gap:3px}
.flag3{color:var(--red)} .flag2{color:var(--orange)} .flag1{color:var(--blue)}
.acts{display:flex;gap:2px;opacity:0;transition:opacity .15s;flex:none}
.trow:hover .acts{opacity:1}
.row-btn{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text-3)}
.row-btn:hover{background:var(--surface-3);color:var(--text-1)}
.row-btn.del:hover{color:var(--red);background:var(--red-soft)}
.done-head{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--text-3);
  padding:9px 6px 4px;cursor:pointer}
.done-head:hover{color:var(--text-2)}
.done-head .arr{transition:transform .2s}
.done-head.closed .arr{transform:rotate(-90deg)}
.donerow{display:flex;align-items:center;gap:9px;padding:6px 6px;border-radius:9px;animation:rowIn .22s ease both}
.donerow .tt2{color:var(--text-3);text-decoration:line-through;text-decoration-color:rgba(128,128,150,.55)}
.donerow .when{margin-left:auto;font-size:11px;color:var(--text-3);flex:none}
.alldone{padding:26px 0 20px;text-align:center;animation:fadeUp .3s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
.alldone .big{width:44px;height:44px;margin:0 auto 8px;border-radius:50%;background:var(--green-soft);color:var(--green);
  display:flex;align-items:center;justify-content:center}
.alldone .t1{font-size:13.5px;font-weight:700}
.alldone .t2{font-size:11.5px;color:var(--text-3);margin-top:1px}

/* 右键菜单 / Toast */
.menu{position:absolute;left:0;top:0;z-index:70;min-width:176px;border-radius:11px;background:var(--surface);
  box-shadow:var(--shadow-2),0 0 0 1px var(--border);padding:5px;font-size:13px;animation:menuIn .15s ease both}
@keyframes menuIn{from{opacity:0;transform:scale(.92)}}
.menu .mi{display:flex;align-items:center;gap:9px;padding:6.5px 10px;border-radius:7px;color:var(--text-1);transition:background .12s}
.menu .mi:hover{background:var(--surface-2)}
.menu .mi .ic{color:var(--text-3)}
.menu .sep{height:1px;background:var(--border-2);margin:4px 8px}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%) translateY(8px);z-index:80;
  display:flex;align-items:center;gap:10px;background:rgba(33,33,43,.92);color:#fff;
  font-size:13px;padding:9px 16px;border-radius:99px;box-shadow:0 10px 34px rgba(0,0,0,.3);
  opacity:0;pointer-events:none;transition:all .25s ease;max-width:92vw;white-space:nowrap}
[data-theme="dark"] .toast{background:rgba(70,70,84,.96)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="ball docked" id="ball">
  <svg class="bring" id="ballRing" width="62" height="62" viewBox="0 0 62 62">
    <circle cx="31" cy="31" r="28" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="3"/>
    <circle class="arc" cx="31" cy="31" r="28" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"
      stroke-dasharray="175.93" stroke-dashoffset="175.93" transform="rotate(-90 31 31)"/>
  </svg>
  <span id="ballIco"></span>
</div>

<div class="panel" id="panel">
  <div class="p-head" id="pHead">
    <span class="logo"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg></span>
    <div><div class="ht">今天</div><div class="hd" id="pHd"></div></div>
    <div class="ring-wrap" id="pRing"></div>
  </div>
  <div class="p-inputwrap">
    <span class="plus" id="pPlus"></span>
    <input id="pInput" placeholder="快速添加…如:明天 14:00 写周报 #工作 !高" autocomplete="off">
  </div>
  <div class="p-chips" id="pChips"></div>
  <div class="p-list" id="pList"></div>
</div>

<div class="toast" id="toast"></div>

<script defer src="ball.js"></script>
</body>
</html>
