<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoDo · 待办事项 — 设计原型</title>
<link rel="stylesheet" href="https://fonts.loli.net/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <!-- ============ 标题栏 ============ -->
  <header class="titlebar" data-tauri-drag-region>
    <div class="titlebar-left">
      <div class="logo"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg></div>
      <span class="app-name">DoDo</span>
    </div>
    <div class="titlebar-center">
      <div class="search" id="searchBox">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.2-4.2"/></svg>
        <input id="searchInput" placeholder="搜索任务…" autocomplete="off">
        <kbd>/</kbd>
      </div>
    </div>
    <div class="titlebar-right">
      <button class="icon-btn" id="themeBtn" title="切换明暗主题"></button>
      <div class="win-controls">
        <button class="win-btn" data-win="min"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <button class="win-btn" data-win="max"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg></button>
        <button class="win-btn close" data-win="close"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
    </div>
  </header>

  <div class="body">
    <!-- ============ 侧边栏 ============ -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- ============ 内容区 ============ -->
    <main class="main">
      <div class="main-scroll" id="mainScroll"></div>
      <div class="quick-add">
        <div class="qa-box">
          <div class="qa-plus"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
          <div class="qa-mid">
            <div class="qa-chips" id="qaChips"></div>
            <input id="qaInput" placeholder="添加任务…如:明天 14:00 写周报 #工作 !高" autocomplete="off">
          </div>
          <button class="qa-help" id="qaHelp" title="输入语法说明" type="button">?</button>
          <div class="qa-hint"><kbd>Enter</kbd> 添加</div>
        </div>
      </div>
    </main>

    <!-- ============ 详情面板 ============ -->
    <aside class="detail" id="detailPanel"><div class="detail-inner" id="detailInner"></div></aside>
  </div>
</div>
<div id="toast"></div>

<script defer src="app.js"></script>
</body>
</html>
