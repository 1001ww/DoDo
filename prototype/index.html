<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoDo · 待办事项 — 设计原型</title>
<link rel="stylesheet" href="https://fonts.loli.net/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<style>
/* ============================= 主题变量 ============================= */
:root{
  --primary:#5B5BD6; --primary-h:#4C4CC4; --primary-soft:rgba(91,91,214,.10); --ring:0 0 0 3px rgba(91,91,214,.15);
  --bg:#F4F4F8; --surface:#FFFFFF; --surface-2:#F7F7FA; --surface-3:#F1F1F6;
  --text-1:#21212B; --text-2:#6F6F7C; --text-3:#A4A4B0;
  --border:#E9E9F0; --border-2:#F0F0F5;
  --red:#E5484D; --red-soft:rgba(229,72,77,.10);
  --orange:#F5A524; --blue:#4A9EF5; --green:#30A46C; --green-soft:rgba(48,164,108,.12);
  --sel:#E9E9F4;
  --shadow-1:0 1px 3px rgba(18,18,28,.06);
  --shadow-2:0 8px 30px rgba(18,18,28,.14);
  --win-shadow:0 24px 80px rgba(28,28,60,.28);
  --wall:linear-gradient(155deg,#ECECF8 0%,#F2F0EC 55%,#E9E9F4 100%);
}
[data-theme="dark"]{
  --primary:#8484F0; --primary-h:#9797F4; --primary-soft:rgba(132,132,240,.14); --ring:0 0 0 3px rgba(132,132,240,.20);
  --bg:#16161B; --surface:#1E1E25; --surface-2:#23232B; --surface-3:#2A2A34;
  --text-1:#ECECF1; --text-2:#9A9AA6; --text-3:#60606C;
  --border:#2C2C36; --border-2:#26262F;
  --red:#F26D72; --red-soft:rgba(242,109,114,.14);
  --orange:#F5A524; --blue:#5AA9F7; --green:#3DBA7A; --green-soft:rgba(61,186,122,.16);
  --sel:#2A2A36;
  --shadow-1:0 1px 3px rgba(0,0,0,.35);
  --shadow-2:0 8px 30px rgba(0,0,0,.5);
  --win-shadow:0 24px 80px rgba(0,0,0,.6);
  --wall:linear-gradient(155deg,#101016 0%,#14141B 55%,#0E0E14 100%);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"Noto Sans SC","Microsoft YaHei UI","PingFang SC","Segoe UI",system-ui,sans-serif;
  font-size:14px;line-height:1.6;color:var(--text-1);background:var(--wall);
  padding:18px;-webkit-font-smoothing:antialiased;overflow:hidden;
}
::selection{background:var(--primary-soft)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(128,128,150,.25);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(128,128,150,.45);background-clip:content-box;border:3px solid transparent}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;font-size:inherit}
input,textarea{font-family:inherit;font-size:inherit;color:inherit;border:none;outline:none;background:transparent}
.ic{flex:none;display:block}

/* ============================= 窗口框架 ============================= */
#app{
  height:100%;min-width:960px;display:flex;flex-direction:column;
  background:var(--bg);border-radius:14px;overflow:hidden;
  box-shadow:var(--win-shadow),0 0 0 1px rgba(128,128,160,.10);
  color:var(--text-1);transition:background .2s;
}

/* ---------- 标题栏 ---------- */
.titlebar{
  height:46px;flex:none;display:flex;align-items:center;gap:12px;
  padding:0 0 0 16px;background:var(--bg);position:relative;z-index:30;user-select:none;
}
.titlebar-left{display:flex;align-items:center;gap:9px;width:216px;flex:none}
.logo{width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,#6366F1,#8B5CF6);
  display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 2px 6px rgba(99,102,241,.4)}
.app-name{font-weight:700;font-size:14.5px;letter-spacing:.2px}
.app-sub{font-size:11px;color:var(--text-3);margin-left:2px;letter-spacing:.5px}
.titlebar-center{flex:1;display:flex;justify-content:center}
.search{display:flex;align-items:center;gap:8px;width:340px;height:30px;padding:0 12px;
  background:var(--surface);border:1px solid var(--border);border-radius:9px;color:var(--text-3);transition:all .15s}
.search:focus-within{border-color:var(--primary);box-shadow:var(--ring);color:var(--text-2)}
.search input{flex:1;font-size:13px;color:var(--text-1)}
.search input::placeholder{color:var(--text-3)}
.search kbd{font-size:10.5px;color:var(--text-3);border:1px solid var(--border);border-radius:5px;padding:0 5px;
  background:var(--surface-2);font-family:inherit}
.titlebar-right{display:flex;align-items:center;height:100%}
.icon-btn{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:var(--text-2);transition:all .15s;margin-right:2px}
.icon-btn:hover{background:var(--surface-3);color:var(--text-1)}
.win-controls{display:flex;height:100%;margin-left:6px}
.win-btn{width:46px;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-2);transition:background .12s}
.win-btn:hover{background:var(--surface-3);color:var(--text-1)}
.win-btn.close:hover{background:#E5484D;color:#fff}

/* ---------- 主体三栏 ---------- */
.body{flex:1;display:flex;min-height:0}

/* ---------- 侧边栏 ---------- */
.sidebar{width:232px;flex:none;display:flex;flex-direction:column;background:var(--bg);
  border-right:1px solid var(--border-2);padding:6px 10px 10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;
  color:var(--text-1);cursor:pointer;transition:background .12s;font-size:13.5px}
.nav-item .ic{color:var(--text-2);transition:color .12s}
.nav-item:hover{background:var(--surface-3)}
.nav-item.active{background:var(--sel);font-weight:600}
.nav-item.active .ic{color:var(--primary)}
.nav-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{min-width:20px;height:18px;padding:0 6px;border-radius:9px;background:var(--primary-soft);color:var(--primary);
  font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.badge.red{background:var(--red-soft);color:var(--red)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.nav-sec{margin-top:14px}
.nav-sec-head{display:flex;align-items:center;justify-content:space-between;padding:0 10px;margin-bottom:3px}
.nav-sec-head span{font-size:11.5px;font-weight:600;color:var(--text-3);letter-spacing:.4px}
.sec-add{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-3)}
.sec-add:hover{background:var(--surface-3);color:var(--text-1)}
.add-list-row{display:flex;align-items:center;gap:8px;padding:0 10px;height:34px}
.add-list-row input{flex:1;font-size:13px;border-bottom:1.5px solid var(--primary);padding-bottom:1px}
.sidebar-foot{margin-top:auto;padding-top:12px}
.foot-note{font-size:11px;color:var(--text-3);padding:2px 10px}

/* ---------- 内容区 ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--surface);position:relative}
.main-scroll{flex:1;overflow-y:auto;padding:26px 30px 10px}
.view-anim{animation:viewIn .22s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:4px}
.view-title{font-size:26px;font-weight:700;letter-spacing:.2px;line-height:1.3}
.view-sub{font-size:13px;color:var(--text-2);margin-top:2px}
.view-stat{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--text-2);padding-bottom:6px}
.ring-wrap{position:relative;width:46px;height:46px}
.ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text-1)}
.group{margin-top:20px}
.group-title{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:6px;padding:0 8px}
.group-title .cnt{color:var(--text-3);font-weight:500}
.group-title.overdue{color:var(--red)}

/* ---------- 任务行 ---------- */
.task-row{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;position:relative;
  transition:background .12s;cursor:default}
.task-row:hover{background:var(--surface-2)}
.task-row + .task-row::before{content:"";position:absolute;top:0;left:39px;right:10px;height:1px;background:var(--border-2)}
.task-row:hover + .task-row::before,.task-row:hover::before{opacity:0}
.checkbox{width:18px;height:18px;border:1.5px solid var(--text-3);border-radius:6px;flex:none;
  display:flex;align-items:center;justify-content:center;color:#fff;transition:all .18s;background:transparent}
.checkbox:hover{border-color:var(--primary)}
.checkbox svg path{stroke-dasharray:14;stroke-dashoffset:14;transition:stroke-dashoffset .25s ease .05s}
.checkbox.checked{background:var(--primary);border-color:var(--primary)}
.checkbox.checked svg path{stroke-dashoffset:0}
.task-main{flex:1;min-width:0}
.tt{position:relative;display:inline;font-size:14px;line-height:1.5;word-break:break-all}
.tt::after{content:"";position:absolute;left:0;top:55%;height:1.5px;width:0;background:var(--text-3);transition:width .3s ease}
.task-row.done .tt::after{width:100%}
.task-row.done .tt{color:var(--text-3)}
.task-row.done .ldot,.task-row.done .due,.task-row.done .tchip{opacity:.5}
.chips{display:inline-flex;gap:5px;margin-left:7px;vertical-align:1px}
.tchip{font-size:11px;color:var(--text-2);background:var(--surface-3);border-radius:99px;padding:0 7px;line-height:18px;white-space:nowrap}
.meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-3);margin-top:2px;flex-wrap:wrap}
.meta .m-item{display:flex;align-items:center;gap:4px}
.ldot{width:7px;height:7px;border-radius:50%}
.due{color:var(--text-3)}
.due.today{color:var(--primary);font-weight:600}
.due.over{color:var(--red);font-weight:600}
.subbar{width:44px;height:4px;border-radius:4px;background:var(--border);overflow:hidden}
.subbar i{display:block;height:100%;background:var(--green);border-radius:4px}
.task-side{display:flex;align-items:center;gap:6px;flex:none}
.flag-hi{color:var(--red)} .flag-md{color:var(--orange)} .flag-lo{color:var(--blue)}
.row-actions{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.task-row:hover .row-actions{opacity:1}
.row-btn{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text-3)}
.row-btn:hover{background:var(--surface-3);color:var(--text-1)}
.row-btn.del:hover{color:var(--red);background:var(--red-soft)}
.row-btn.ok:hover{color:var(--green);background:var(--green-soft)}

/* ---------- 空状态 ---------- */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 0 50px;color:var(--text-3)}
.empty .eicon{width:96px;height:96px;margin-bottom:12px}
.empty h3{font-size:15px;font-weight:600;color:var(--text-2);margin-bottom:4px}
.empty p{font-size:12.5px}

/* ---------- 快速添加 ---------- */
.quick-add{flex:none;padding:10px 30px 14px;background:linear-gradient(transparent,var(--surface) 40%)}
.qa-box{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:9px 14px 9px 9px;box-shadow:var(--shadow-1);transition:all .18s}
.qa-box:focus-within{border-color:var(--primary);box-shadow:var(--ring),var(--shadow-2)}
.qa-plus{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff;
  display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 2px 6px rgba(99,102,241,.35)}
.qa-mid{flex:1;min-width:0}
.qa-chips{display:flex;gap:6px;margin-bottom:3px;flex-wrap:wrap}
.qa-chips:empty{display:none}
.qa-chip{font-size:11px;font-weight:600;border-radius:6px;padding:0 7px;line-height:19px;display:inline-flex;align-items:center;gap:4px}
.qa-chip.date{background:var(--primary-soft);color:var(--primary)}
.qa-chip.list{background:var(--green-soft);color:var(--green)}
.qa-chip.prio{background:var(--red-soft);color:var(--red)}
.qa-chip.prio.p2{background:rgba(245,165,36,.14);color:var(--orange)}
.qa-chip.prio.p1{background:rgba(74,158,245,.12);color:var(--blue)}
.qa-chip.tag{background:var(--surface-3);color:var(--text-2)}
.qa-box input{width:100%;font-size:13.5px}
.qa-box input::placeholder{color:var(--text-3)}
.qa-hint{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-3);flex:none}
.qa-hint kbd{font-size:10.5px;border:1px solid var(--border);border-radius:5px;padding:0 5px;background:var(--surface-2)}
.qa-help{width:20px;height:20px;border-radius:50%;border:1px solid var(--border);color:var(--text-3);
  font-size:12px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;
  flex:none;cursor:pointer;transition:all .15s;background:transparent}
.qa-help:hover{border-color:var(--primary);color:var(--primary)}
.qa-help-pop{position:fixed;z-index:150;background:var(--surface);border:1px solid var(--border);border-radius:12px;
  box-shadow:var(--shadow-2);padding:14px 16px 12px;width:410px;animation:menuIn .15s ease}
.qa-help-pop h4{font-size:13px;font-weight:700;margin-bottom:8px}
.qh-row{display:grid;grid-template-columns:60px 1fr;gap:10px;padding:5px 0;font-size:12px;align-items:baseline}
.qh-row .k{color:var(--text-2);font-weight:600}
.qh-row .v{color:var(--text-1);line-height:1.9}
.qh-row .v code{font-family:inherit;font-size:11.5px;font-weight:600;border-radius:6px;padding:1.5px 7px;
  margin:0 4px 3px 0;display:inline-block;line-height:1.5;white-space:nowrap}
code.tok.d{background:var(--primary-soft);color:var(--primary)}
code.tok.l{background:var(--green-soft);color:var(--green)}
code.tok.t{background:var(--surface-3);color:var(--text-2)}
code.tok.p{background:var(--red-soft);color:var(--red)}
code.tok.p1{background:rgba(74,158,245,.12);color:var(--blue)}
.qhn{color:var(--text-3);font-size:11.5px}
.qa-help-pop .tip{margin-top:8px;padding-top:8px;border-top:1px solid var(--border-2);font-size:11.5px;color:var(--text-3);line-height:1.6}

/* ---------- 详情面板 ---------- */
.detail{width:0;flex:none;overflow:hidden;transition:width .25s ease;border-left:1px solid var(--border-2);background:var(--surface)}
.detail.open{width:340px}
.detail-inner{width:340px;height:100%;display:flex;flex-direction:column;padding:20px 18px 14px}
.d-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.d-head .checkbox{margin-top:0}
.d-title{flex:1;font-size:16.5px;font-weight:600;line-height:1.45;padding:2px 6px;border-radius:8px}
.d-title:focus{background:var(--surface-2)}
.d-head .icon-btn{width:28px;height:28px;flex:none}
.d-note{width:100%;min-height:64px;resize:none;font-size:13px;color:var(--text-2);padding:8px 10px;border-radius:10px;
  background:var(--surface-2);line-height:1.6;margin-top:10px}
.d-note::placeholder{color:var(--text-3)}
.d-sec{margin-top:16px}
.d-sec-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px;padding:0 2px}
.d-sub-item{display:flex;align-items:center;gap:9px;padding:5px 2px;font-size:13px}
.d-sub-item .checkbox{width:16px;height:16px;margin-top:0;border-radius:5px}
.d-sub-item.done .st{color:var(--text-3);text-decoration:line-through}
.d-sub-item .st{flex:1}
.d-sub-add{display:flex;align-items:center;gap:9px;padding:6px 2px;color:var(--text-3);font-size:13px}
.d-sub-add input{flex:1;font-size:13px}
.d-sub-add input::placeholder{color:var(--text-3)}
.d-props{margin-top:6px}
.d-prop{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:9px;cursor:pointer;transition:background .12s}
.d-prop:hover{background:var(--surface-2)}
.d-prop .ic{color:var(--text-3)}
.d-prop .p-label{width:52px;flex:none;font-size:12.5px;color:var(--text-2)}
.d-prop .p-val{flex:1;font-size:13px;display:flex;align-items:center;gap:6px;justify-content:flex-end;color:var(--text-1)}
.d-prop .p-val .ph{color:var(--text-3)}
.d-prop .p-val .ic{color:var(--text-3)}
.d-foot{margin-top:auto;padding-top:12px}
.d-del{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:9px;color:var(--red);font-size:13px;transition:background .12s}
.d-del:hover{background:var(--red-soft)}

/* ---------- 设置弹窗 ---------- */
.overlay{position:fixed;inset:0;background:rgba(18,18,28,.42);backdrop-filter:blur(3px);z-index:80;
  display:flex;align-items:center;justify-content:center;animation:fadeIn .16s ease}
@keyframes fadeIn{from{opacity:0}}
.sdialog{width:700px;max-width:calc(100vw - 60px);height:520px;max-height:calc(100vh - 80px);position:relative;
  background:var(--surface);border-radius:14px;box-shadow:var(--shadow-2),0 0 0 1px var(--border);
  display:flex;overflow:hidden;animation:dialogIn .2s ease}
@keyframes dialogIn{from{opacity:0;transform:scale(.96) translateY(8px)}}
.sdialog .sclose{position:absolute;top:10px;right:10px;z-index:2}
.snav{width:172px;flex:none;background:var(--bg);border-right:1px solid var(--border-2);padding:16px 10px 12px;display:flex;flex-direction:column}
.snav h2{font-size:16px;font-weight:700;padding:0 10px;margin-bottom:12px}
.snav-item{display:flex;align-items:center;gap:9px;height:34px;padding:0 10px;border-radius:8px;font-size:13px;
  color:var(--text-2);cursor:pointer;transition:background .12s,color .12s}
.snav-item .ic{color:var(--text-3)}
.snav-item:hover{background:var(--surface-3);color:var(--text-1)}
.snav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.snav-item.active .ic{color:var(--primary)}
.snav-foot{margin-top:auto;font-size:11px;color:var(--text-3);padding:0 10px}
.scontent{flex:1;padding:20px 24px;overflow-y:auto}
.scontent h3{font-size:14.5px;font-weight:700;margin:2px 0 3px}
.scontent .sdesc{font-size:12px;color:var(--text-3);margin-bottom:14px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;border-radius:10px;cursor:pointer;transition:background .12s}
.srow:hover{background:var(--surface-2)}
.srow .sl{font-size:13px}
.srow .sd{font-size:11.5px;color:var(--text-3);margin-top:1px}
.srow .sv{font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:5px;flex:none}
.tcards{display:flex;gap:12px;margin:4px 0 16px}
.tcard{width:152px;border:1.5px solid var(--border);border-radius:11px;padding:9px;cursor:pointer;transition:all .15s;background:var(--surface-2)}
.tcard:hover{border-color:var(--text-3)}
.tcard.active{border-color:var(--primary);box-shadow:var(--ring)}
.tcard .prev{height:62px;border-radius:7px;margin-bottom:8px;position:relative;overflow:hidden}
.prev-light{background:#F4F4F8;border:1px solid #E9E9F0}
.prev-dark{background:#16161B;border:1px solid #2C2C36}
.prev-auto{background:linear-gradient(105deg,#F4F4F8 49.5%,#16161B 50.5%)}
.prev .bar{position:absolute;left:9px;height:4px;border-radius:4px;background:rgba(125,125,155,.4)}
.prev-dark .bar{background:rgba(200,200,230,.28)}
.prev-auto .bar{background:rgba(125,125,155,.4)}
.tcard .tname{font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:space-between;color:var(--text-1)}
.tcard .m-check{color:var(--primary);visibility:hidden}
.tcard.active .m-check{visibility:visible}
.switch{width:38px;height:22px;border-radius:11px;background:var(--border);position:relative;transition:background .18s;flex:none;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .18s}
.switch.on{background:var(--primary)}
.switch.on::after{left:18px}
.about-hero{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);margin-bottom:12px}
.about-hero .logo{width:44px;height:44px;border-radius:13px}
.about-hero .logo svg{width:22px;height:22px}
.about-hero h4{font-size:16px;font-weight:700}
.about-hero p{font-size:12px;color:var(--text-3)}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;padding:0 12px}
.stackchip{font-size:11.5px;padding:2.5px 11px;border-radius:99px;background:var(--primary-soft);color:var(--primary);font-weight:600}
.sbtn{font-size:12.5px;padding:5.5px 14px;border-radius:8px;border:1px solid var(--border);color:var(--text-2);background:var(--surface);transition:all .15s;cursor:pointer}
.sbtn:hover{border-color:var(--primary);color:var(--primary)}
.sbtn.danger{color:var(--red);border-color:transparent;background:var(--red-soft)}
.sbtn.danger:hover{background:var(--red);border-color:var(--red);color:#fff}
.mlist{border:1px solid var(--border-2);border-radius:11px;overflow:hidden;margin-bottom:4px}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--border-2);background:var(--surface)}
.mrow:last-child{border-bottom:none}
.mrow:hover{background:var(--surface-2)}
.mname{flex:1;font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcount{font-size:11.5px;color:var(--text-3);flex:none}
.mrow .row-btn{width:26px;height:26px;opacity:.6;flex:none}
.mrow .row-btn:hover{opacity:1}
.mrow .row-btn.confirm{color:var(--red);background:var(--red-soft);opacity:1}
.medit{display:flex;align-items:center;gap:9px;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--border-2)}
.medit input{flex:1;min-width:0;border-bottom:1.5px solid var(--primary);font-size:13px;padding-bottom:1px}
.cswatches{display:flex;gap:5px;flex:none}
.csw{width:16px;height:16px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .12s;flex:none}
.csw:hover{transform:scale(1.15)}
.csw.on{border-color:var(--text-1)}
.madd{display:flex;align-items:center;gap:6px;padding:8px 12px;font-size:12.5px;color:var(--text-2);cursor:pointer;border-radius:9px;margin:2px 0 6px}
.madd:hover{background:var(--surface-2);color:var(--primary)}

/* ---------- 日历视图 ---------- */
.cal-wrap{display:flex;gap:18px;margin-top:14px;min-height:0}
.cal-main{flex:1;min-width:0}
.cal-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-nav .ym{font-size:15px;font-weight:700;margin-right:auto}
.cal-nav .icon-btn{width:28px;height:28px}
.btn-ghost{font-size:12.5px;padding:5px 12px;border-radius:8px;border:1px solid var(--border);color:var(--text-2);transition:all .15s}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
.cal-week span{text-align:center;font-size:11.5px;color:var(--text-3);font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{aspect-ratio:1.15;border-radius:10px;padding:6px 7px;display:flex;flex-direction:column;gap:3px;
  border:1px solid transparent;cursor:pointer;transition:background .12s}
.cal-cell:hover{background:var(--surface-2)}
.cal-cell.dim{opacity:.38}
.cal-cell.sel{background:var(--primary-soft);border-color:var(--primary)}
.cal-num{font-size:12.5px;color:var(--text-2);width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cal-cell.sel .cal-num{color:var(--primary);font-weight:700}
.cal-cell.today .cal-num{background:var(--primary);color:#fff;font-weight:700}
.cal-dots{display:flex;gap:3px;padding-left:2px;align-items:center;min-height:6px;flex-wrap:wrap}
.cal-dot{width:5px;height:5px;border-radius:50%}
.cal-more{font-size:9.5px;color:var(--text-3)}
.cal-side{width:252px;flex:none;border-left:1px solid var(--border-2);padding-left:16px}
.cal-side h4{font-size:14px;font-weight:700;margin-bottom:2px}
.cal-side .cs-sub{font-size:12px;color:var(--text-3);margin-bottom:10px}

.kanban{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px;margin-top:16px;align-items:start;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--surface-2);border-radius:12px;padding:8px;transition:background .15s,box-shadow .15s}
.kcol.drag-over{background:var(--primary-soft);box-shadow:inset 0 0 0 1.5px var(--primary)}
.kcol-head{display:flex;align-items:center;gap:7px;padding:4px 6px 8px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.kcol-head .cnt{color:var(--text-3);font-weight:500}
.kcol-body{display:flex;flex-direction:column;gap:8px;min-height:60px}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 11px;cursor:grab;
  box-shadow:var(--shadow-1);transition:box-shadow .15s,transform .15s}
.kcard:hover{box-shadow:var(--shadow-2);transform:translateY(-1px)}
.kcard:active{cursor:grabbing}
.kcard.dragging{opacity:.4}
.kcard-title{font-size:13px;line-height:1.5;word-break:break-all}
.kcard-meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-3);margin-top:5px}
.kempty{font-size:12px;color:var(--text-3);text-align:center;padding:14px 0;border:1.5px dashed var(--border);border-radius:10px}

/* ---------- 菜单 / 提示 ---------- */
.menu{position:fixed;z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:11px;
  box-shadow:var(--shadow-2);padding:5px;min-width:168px;animation:menuIn .14s ease}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.menu-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap}
.menu-item:hover{background:var(--surface-2)}
.menu-item .ic{color:var(--text-3)}
.menu-item .m-check{margin-left:auto;color:var(--primary);visibility:hidden}
.menu-item.active .m-check{visibility:visible}
.menu-item .dot{margin-left:auto}
.menu-sep{height:1px;background:var(--border-2);margin:5px 8px}
.menu-input{display:flex;align-items:center;gap:8px;padding:5px 10px 7px}
.menu-input input{border:1px solid var(--border);border-radius:7px;padding:3px 8px;font-size:12.5px;background:var(--surface-2);color:var(--text-1)}
.menu-label{font-size:11px;color:var(--text-3);padding:4px 10px 2px}
.time-menu{width:218px}
.ti-row{display:flex;align-items:center;gap:7px;padding:6px 12px 9px}
.ti-row .lbl{font-size:12px;color:var(--text-2);margin-right:auto}
.ti-box{width:36px;height:27px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);
  text-align:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--text-1);
  transition:border-color .15s,box-shadow .15s,background .15s;padding:0}
.ti-box:focus{border-color:var(--primary);box-shadow:var(--ring);background:var(--surface)}
.ti-sep{color:var(--text-3);font-weight:700}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:200;background:var(--text-1);color:var(--bg);
  border-radius:11px;padding:10px 16px;font-size:13px;box-shadow:var(--shadow-2);display:none;align-items:center;gap:14px;animation:toastIn .2s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
#toast button{color:#9F9FF7;font-weight:700;font-size:13px}
[data-theme="dark"] #toast{background:#3A3A48;color:#ECECF1}
[data-theme="dark"] #toast button{color:#A5A5FF}

</head>

const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseISO=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};

  if(df===0)return`今天 · ${x.getMonth()+1}月${x.getDate()}日 ${WD[x.getDay()]}`;
  if(df===1)return`明天 · ${x.getMonth()+1}月${x.getDate()}日 ${WD[x.getDay()]}`;

function fmtTime(t){
  if(!t)return t;

}

/* ================= 状态 ================= */
let settings=Object.assign({themeMode:localStorage.getItem('dodo-theme')||'light',startView:'today',weekStart:'mon',timeFormat:'24',notify:true,defaultRemind:null},JSON.parse(localStorage.getItem('dodo-settings')||'{}'));
const SAMPLE=JSON.parse(JSON.stringify(tasks));
const state={view:'today',search:'',calMonth:null,calSel:TODAY,detailId:null,undo:null,addingList:false,addingTag:false};
if(!state.calMonth){const n=new Date();state.calMonth=new Date(n.getFullYear(),n.getMonth(),1)}

/* ================= 侧边栏 ================= */
const SMART=[
  {id:'today',   name:'今天',  icon:'sun'},
  {id:'inbox',   name:'收件箱',icon:'inbox'},
  {id:'upcoming',name:'计划',  icon:'cal7'},
  {id:'kanban',  name:'看板',  icon:'kanban'},
  {id:'calendar',name:'日历',  icon:'calendar'},
  {id:'all',     name:'全部',  icon:'layers'},
  {id:'completed',name:'已完成',icon:'check'},
];
let EXTRA_TAGS=[];
function tagList(){return[...new Set([...EXTRA_TAGS,...tasks.flatMap(t=>t.tags||[])])]}
function buildSidebar(){
  const todayCnt=tasks.filter(t=>!t.done&&t.due&&diffDays(TODAY,t.due)<=0).length;
  const overdueCnt=tasks.filter(t=>!t.done&&t.due&&diffDays(TODAY,t.due)<0).length;
  const inboxCnt=tasks.filter(t=>!t.done&&!t.list).length;
  const nav=(v,name,icon,badge,red)=>`
    <div class="nav-item ${state.view===v?'active':''}" data-nav="${v}">
      ${ic(icon,16.5)}<span class="nav-name">${name}</span>${badge?`<span class="badge ${red?'red':''}">${badge}</span>`:''}
    </div>`;
  let html=`
  <div class="nav-sec" style="margin-top:2px">${SMART.map(s=>nav(s.id,s.name,s.icon,
    s.id==='today'?todayCnt:(s.id==='inbox'?inboxCnt:0),s.id==='today'&&overdueCnt>0)).join('')}</div>`;
  html+=`<div class="nav-sec">
    <div class="nav-sec-head"><span>清单</span><button class="sec-add" data-addlist title="新建清单">${ic('plus',13)}</button></div>
    ${state.addingList?`<div class="add-list-row"><input id="newListInput" placeholder="清单名称,回车确认"></div>`:''}
    ${LISTS.map(l=>{const c=tasks.filter(t=>!t.done&&t.list===l.id).length;return`
      <div class="nav-item ${state.view==='list:'+l.id?'active':''}" data-nav="list:${l.id}">
        <span class="dot" style="background:${l.color}"></span><span class="nav-name">${esc(l.name)}</span>${c?`<span class="badge">${c}</span>`:''}
      </div>`}).join('')}
  </div>`;
  const tags=tagList();
  html+=`<div class="nav-sec"><div class="nav-sec-head"><span>标签</span>
    <button class="sec-add" data-addtag title="新建标签">${ic('plus',13)}</button></div>
    ${state.addingTag?`<div class="add-list-row"><input id="newTagInput" placeholder="标签名称,回车确认"></div>`:''}
    ${tags.map(tg=>{const c=tasks.filter(t=>!t.done&&(t.tags||[]).includes(tg)).length;return`
      <div class="nav-item ${state.view==='tag:'+tg?'active':''}" data-nav="tag:${esc(tg)}">
        ${ic('tag',15)}<span class="nav-name">${esc(tg)}</span>${c?`<span class="badge">${c}</span>`:''}
      </div>`}).join('')}</div>`;
  html+=`<div class="sidebar-foot">
    <div class="nav-item" data-settings>${ic('sliders',16.5)}<span class="nav-name">设置</span></div>
    <div class="foot-note">DoDo · 设计原型 v0.1</div>
  </div>`;
  $('#sidebar').innerHTML=html;
}

/* ================= 视图数据 ================= */
function matchSearch(t){
  const q=state.search.trim().toLowerCase();
  return !q||(t.title+' '+(t.note||'')).toLowerCase().includes(q);
}
function groups(){
  const v=state.view, g=[];
  const push=(title,items,accent)=>{items=items.filter(matchSearch).sort(cmp);if(items.length||!state.search.trim())g.push({title,items,accent})};
  if(v==='today'){
    push('逾期',tasks.filter(t=>!t.done&&t.due&&diffDays(TODAY,t.due)<0),'overdue');
    push('今天',tasks.filter(t=>!t.done&&t.due===TODAY));
  }else if(v==='inbox'){
    push('收件箱',tasks.filter(t=>!t.done&&!t.list));
  }else if(v==='upcoming'){
    for(let i=0;i<7;i++){const d=addDays(i);
      push(dayLabel(d),tasks.filter(t=>!t.done&&t.due===d),i===0?'today':'');}
  }else if(v==='all'){
    for(const l of LISTS)push(l.name,tasks.filter(t=>!t.done&&t.list===l.id));
    push('收件箱',tasks.filter(t=>!t.done&&!t.list));
  }else if(v.startsWith('list:')){
    const l=listById(v.slice(5));push(l?l.name:'清单',tasks.filter(t=>!t.done&&t.list===v.slice(5)));
  }else if(v.startsWith('tag:')){
    const tg=v.slice(4);push('# '+tg,tasks.filter(t=>!t.done&&(t.tags||[]).includes(tg)));
  }else if(v==='completed'){
    push('今天完成',tasks.filter(t=>t.done&&t.doneAt===TODAY));
    push('更早完成',tasks.filter(t=>t.done&&t.doneAt&&t.doneAt!==TODAY));
  }
  return g;
}

/* ================= 任务行 ================= */
function taskRow(t,opts={}){
  const l=t.list?listById(t.list):null;
  const df=t.due?diffDays(TODAY,t.due):null;
  const dueCls=df==null?'':(df<0?'due over':(df===0?'due today':'due'));
  const subs=t.subs||[],sd=subs.filter(s=>s.d).length;
  return`
  <div class="task-row ${t.done?'done':''}" data-open="${t.id}">
    <button class="checkbox ${t.done?'checked':''}" data-toggle="${t.id}">${CHECK_SVG}</button>
    <div class="task-main">
      <div><span class="tt">${esc(t.title)}</span><span class="chips">${(t.tags||[]).map(tg=>`<span class="tchip">${esc(tg)}</span>`).join('')}</span></div>
      ${(l||t.due||t.time||t.repeat||subs.length)?`<div class="meta">
        ${l?`<span class="m-item"><span class="ldot" style="background:${l.color}"></span>${esc(l.name)}</span>`:''}
        ${t.time?`<span class="m-item">${ic('clock',12)}${fmtTime(t.time)}</span>`:''}
        ${t.due?`<span class="m-item due ${dueCls}">${fmtDue(t.due)}</span>`:''}
        ${t.repeat?`<span class="m-item">${ic('repeat',12)}${REPEAT[t.repeat]}</span>`:''}
        ${subs.length?`<span class="m-item"><span class="subbar"><i style="width:${Math.round(sd/subs.length*100)}%"></i></span>${sd}/${subs.length}</span>`:''}
      </div>`:''}
    </div>
    <div class="task-side">
      ${t.prio?`<span class="${PRIO[t.prio].cls}" title="${PRIO[t.prio].n}优先级">${ic('flag',14,2)}</span>`:''}
      <span class="row-actions">
        ${opts.move?`<button class="row-btn" data-move="${t.id}" title="移到明天">${ic('arrow',14)}</button>`:''}
        ${t.done?`<button class="row-btn ok" data-restore="${t.id}" title="恢复任务">${ic('undo',14)}</button>`:''}
        <button class="row-btn del" data-del="${t.id}" title="删除">${ic('trash',14)}</button>
      </span>
    </div>
  </div>`;
}

/* ================= 主区渲染 ================= */
function buildMain(){
  const v=state.view;
  const el=$('#mainScroll');
  /* 日历视图 */
  if(v==='calendar'){
    const y=state.calMonth.getFullYear(),m=state.calMonth.getMonth();
    const ws=settings.weekStart==='sun'?0:1;
    const off=((new Date(y,m,1).getDay()-ws)+7)%7, dim=new Date(y,m+1,0).getDate(), dimP=new Date(y,m,0).getDate();
    let cells='';
    for(let i=0;i<42;i++){
      let num,diso,dimmed=false;
      if(i<off){num=dimP-off+1+i;dimmed=true;diso=iso(new Date(y,m-1,num))}
      else if(i-off<dim){num=i-off+1;diso=iso(new Date(y,m,num))}
      else{num=i-off-dim+1;dimmed=true;diso=iso(new Date(y,m+1,num))}
      const dts=tasks.filter(t=>t.due===diso&&!t.done);
      const dots=dts.slice(0,3).map(t=>{const c=t.list?listById(t.list)?.color:null;return`<span class="cal-dot" style="background:${c||'var(--text-3)'}"></span>`}).join('');
      cells+=`<div class="cal-cell ${dimmed?'dim':''} ${diso===state.calSel?'sel':''} ${diso===TODAY?'today':''}" data-cal="${diso}">
        <span class="cal-num">${num}</span><div class="cal-dots">${dots}${dts.length>3?`<span class="cal-more">+${dts.length-3}</span>`:''}</div></div>`;
    }
    const sel=state.calSel, selTs=tasks.filter(t=>t.due===sel).sort(cmp);
    const sx=parseISO(sel);
    el.innerHTML=`<div class="view-anim">
      <div class="view-head"><div><div class="view-title">日历</div><div class="view-sub">按月浏览任务,点击日期查看当天安排</div></div></div>
      <div class="cal-wrap"><div class="cal-main">
        <div class="cal-nav">
          <span class="ym">${y} 年 ${m+1} 月</span>
          <button class="btn-ghost" data-cal-today>回到今天</button>
          <button class="icon-btn" data-cm="-1">${ic('chevL',16)}</button>
          <button class="icon-btn" data-cm="1">${ic('chevR',16)}</button>
        </div>
        <div class="cal-week">${(ws===1?['一','二','三','四','五','六','日']:['日','一','二','三','四','五','六']).map(d=>`<span>周${d}</span>`).join('')}</div>
        <div class="cal-grid">${cells}</div>
      </div>
      <div class="cal-side">
        <h4>${sx.getMonth()+1}月${sx.getDate()}日</h4><div class="cs-sub">${WD[sx.getDay()]}${sel===TODAY?' · 今天':''}</div>
        ${selTs.length?selTs.map(t=>taskRow(t)).join(''):`<div style="font-size:12.5px;color:var(--text-3);padding:8px 2px">这一天没有任务</div>`}
      </div></div></div>`;
    return;
  }
  /* 看板视图 */
  if(v==='kanban'){
    const cols=[3,2,1,0].map(p=>({p,items:tasks.filter(t=>!t.done&&(t.prio||0)===p&&matchSearch(t))}));
    el.innerHTML=`<div class="view-anim">
      <div class="view-head"><div><div class="view-title">看板</div><div class="view-sub">按优先级分列,拖动卡片可调整优先级</div></div></div>
      <div class="kanban">${cols.map(c=>`
        <div class="kcol" data-drop="${c.p}">
          <div class="kcol-head"><span class="dot" style="background:${PRIO[c.p].c};width:9px;height:9px"></span>${PRIO[c.p].n}优先级<span class="cnt">${c.items.length}</span></div>
          <div class="kcol-body">${c.items.map(t=>{
            const l=t.list?listById(t.list):null;const df=t.due?diffDays(TODAY,t.due):null;
            return`<div class="kcard" draggable="true" data-open="${t.id}" data-drag="${t.id}">
              <div class="kcard-title">${esc(t.title)}</div>
              <div class="kcard-meta">${l?`<span class="dot" style="background:${l.color};width:6px;height:6px"></span>${esc(l.name)}`:''}
              ${t.due?`<span class="${df!=null&&df<0?'due over':(df===0?'due today':'')}">${fmtDue(t.due)}</span>`:''}
              ${(t.subs||[]).length?`<span>${ic('checkS',11)}${t.subs.filter(s=>s.d).length}/${t.subs.length}</span>`:''}</div>
            </div>`}).join('')||`<div class="kempty">拖卡片到这里</div>`}</div>
        </div>`).join('')}</div></div>`;
    return;
  }
  /* 列表类视图 */
  const G=groups();
  const flat=G.flatMap(x=>x.items);
  const shown=G.filter(g=>g.items.length);
  let head='',ring='';
  if(v==='today'){
    const undone=tasks.filter(t=>!t.done&&t.due&&diffDays(TODAY,t.due)<=0).length;
    const doneToday=tasks.filter(t=>t.done&&t.doneAt===TODAY).length;
    const total=undone+doneToday, pct=total?Math.round(doneToday/total*100):0;
    if(total)ring=`<div class="ring-wrap"><svg width="46" height="46" viewBox="0 0 46 46">
      <circle cx="23" cy="23" r="19" fill="none" stroke="var(--border)" stroke-width="4.5"/>
      <circle cx="23" cy="23" r="19" fill="none" stroke="${pct===100?'var(--green)':'var(--primary)'}" stroke-width="4.5" stroke-linecap="round"
        stroke-dasharray="${(2*Math.PI*19).toFixed(1)}" stroke-dashoffset="${(2*Math.PI*19*(1-pct/100)).toFixed(1)}" transform="rotate(-90 23 23)" style="transition:stroke-dashoffset .5s"/>
      </svg><div class="ring-num">${pct}%</div></div>`;
    const x=new Date();
    head=`<div class="view-title">今天</div><div class="view-sub">${x.getFullYear()}年${x.getMonth()+1}月${x.getDate()}日 · ${WD[x.getDay()]}</div>`;
  }else{
    const names={inbox:'收件箱',upcoming:'计划',all:'全部',completed:'已完成'};
    const subs={inbox:'没有清单归属的任务会先落在这里',upcoming:'未来 7 天的任务安排',all:'所有未完成任务,按清单分组',completed:'已完成任务的记录'};
    if(v.startsWith('list:')){const l=listById(v.slice(5));head=`<div class="view-title">${esc(l?l.name:'')}</div><div class="view-sub">${flat.length} 个未完成任务</div>`}
    else if(v.startsWith('tag:'))head=`<div class="view-title"># ${esc(v.slice(4))}</div><div class="view-sub">按标签筛选的任务</div>`;
    else head=`<div class="view-title">${names[v]||''}</div><div class="view-sub">${subs[v]||''}</div>`;
  }
  const stat=state.search.trim()
    ?`<span>搜索“${esc(state.search)}” · ${flat.length} 个结果</span>`
    :(v==='today'?`<span>${flat.length} 项待完成</span>`:`<span>${flat.length} 项</span>`);
  let body='';
  if(state.search.trim()&&!flat.length)body=emptyState('inbox','没有找到匹配的任务','试试更换关键词');
  else if(!flat.length)body=emptyState('check','这里没有任务','享受当下,或用下方输入条快速添加');
  else body=shown.map(g=>`<div class="group">
      <div class="group-title ${g.accent==='overdue'?'overdue':''}">${g.title}<span class="cnt">${g.items.length}</span></div>
      ${g.items.map(t=>taskRow(t,{move:v==='today'})).join('')}</div>`).join('');
  el.innerHTML=`<div class="view-anim"><div class="view-head"><div>${head}</div><div class="view-stat">${stat}${ring}</div></div>${body}</div>`;
}

/* ================= 菜单 ================= */
let menuEl=null;
function closeMenu(){if(menuEl){menuEl.remove();menuEl=null;document.removeEventListener('mousedown',outside,false)}}
function outside(e){if(menuEl&&!menuEl.contains(e.target))closeMenu()}
function openMenu(anchor,html,after,cls){
  closeMenu();
  menuEl=document.createElement('div');menuEl.className='menu'+(cls?' '+cls:'');menuEl.innerHTML=html;
  document.body.appendChild(menuEl);
  const r=anchor.getBoundingClientRect(),w=menuEl.offsetWidth,h=menuEl.offsetHeight;
  let x=Math.min(r.left,innerWidth-w-10),y=r.bottom+6;
  if(y+h>innerHeight-10)y=Math.max(10,r.top-h-6);
  menuEl.style.left=x+'px';menuEl.style.top=y+'px';
  document.addEventListener('mousedown',outside,false);

/* ================= 快速添加(自然语言) ================= */
function parseQuick(raw){
  /* 全角标点归一化(中文输入法场景) */
  let text=raw.replace(/[！＃＠]/g,c=>({'！':'!','＃':'#','＠':'@'}[c]));
  const chips=[];let due=null,time=null,list=null,prio=0,repeat=null;const tags=[];
  const take=re=>{const m=text.match(re);if(m){text=text.replace(m[0],' ').trim();return m}return null};
  let m;
  /* 时刻:14:00 / 14点 / 下午3点半 / 上午9:30 */
  if(m=take(/(?:上午|中午|下午|晚上)?\s*\d{1,2}[:：点]\d{0,2}分?半?/)){
    const am=m[0].match(/上午|中午|下午|晚上/)?.[0];
    const half=/半/.test(m[0]);
    let s=m[0].replace(/[分\s]/g,'').replace(/[：点]/g,':').replace('半','');
    if(am)s=s.replace(am,'');
    let[hh,mm]=s.split(':');hh=+hh;mm=mm?+mm:(half?30:0);
    if((am==='下午'||am==='晚上')&&hh<12)hh+=12;
    if(am==='中午'&&hh<12)hh=12;
    if(hh<24){time=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;chips.push({k:'date',v:time})}
  }
  /* 重复:每天 / 每周 / 每月 */
  if(m=take(/每个?月/)){repeat='monthly';chips.push({k:'date',v:'每月'})}
  else if(m=take(/每个?周([一二三四五六日天])?/)){
    repeat='weekly';chips.push({k:'date',v:'每周'+(m[1]||'')});
    if(m[1]){const wd='一二三四五六日天'.indexOf(m[1]);
      let delta=(wd+1-new Date().getDay()+7)%7;if(delta===0)delta=7;due=addDays(delta)}
  }
  else if(m=take(/每个?(天|日)/)){repeat='daily';chips.push({k:'date',v:'每天'})}
  /* 相对日期:今天/明天/后天/大后天 */
  if(m=take(/大后天|后天|明天|今天|今日|明日/)){
    due=addDays({'今天':0,'今日':0,'明天':1,'明日':1,'后天':2,'大后天':3}[m[0]]);chips.push({k:'date',v:m[0]});
  }
  if(!due&&(m=take(/下个?月(\d{1,2})[日号]?/))){
    const now=new Date();due=iso(new Date(now.getFullYear(),now.getMonth()+1,+m[1]||1));chips.push({k:'date',v:m[0]});
  }
  if(!due&&(m=take(/\d{1,2}月\d{1,2}[日号]/))){
    const[a,b]=m[0].match(/\d+/g).map(Number);
    const now=new Date();let d=new Date(now.getFullYear(),a-1,b);if(d<now)d=new Date(now.getFullYear()+1,a-1,b);
    due=iso(d);chips.push({k:'date',v:m[0]});
  }
  if(!due&&(m=take(/\d{4}-\d{1,2}-\d{1,2}/))){const[y,mo,dd]=m[0].split('-').map(Number);due=iso(new Date(y,mo-1,dd));chips.push({k:'date',v:m[0]})}
  if(!due&&(m=take(/下?周[一二三四五六日天]/))){
    const wd='一二三四五六日天'.indexOf(m[0].replace('下','').replace('周',''));
    const now=new Date();let delta=(wd+1-now.getDay()+7)%7;if(delta===0)delta=7;if(m[0].startsWith('下'))delta+=7;
    due=addDays(delta);chips.push({k:'date',v:m[0]});
  }
  if(!due&&(m=take(/周末/))){due=addDays((6-new Date().getDay()+7)%7||7);chips.push({k:'date',v:'周末'})}
  if(!due&&(m=text.match(/\d{1,2}[日号]/))){
    const day=parseInt(m[0],10);
    if(day>=1&&day<=31){
      text=text.replace(m[0],' ').trim();
      const now=new Date();
      let d=new Date(now.getFullYear(),now.getMonth(),day);
      if(d<new Date(now.getFullYear(),now.getMonth(),now.getDate()))d=new Date(now.getFullYear(),now.getMonth()+1,day);
      due=iso(d);chips.push({k:'date',v:m[0]});
    }
  }
  /* 清单与标签 */
  while(m=take(/#(\S+)/)){const g=m[1];const l=LISTS.find(l=>l.name===g||l.name.startsWith(g));if(l){list=l.id;chips.push({k:'list',v:'#'+l.name})}else{tags.push(g);chips.push({k:'tag',v:'#'+g})}}
  while(m=take(/@(\S+)/)){tags.push(m[1]);chips.push({k:'tag',v:'@'+m[1]})}
  /* 优先级:!高 / 高优先级 / 优先级高 / P1-P3 */
  if(m=take(/!(?:优先级)?(高|中|低)(?:优先级)?/)){prio={高:3,中:2,低:1}[m[1]]}
  else if(m=take(/(高|中|低)优先级/)){prio={高:3,中:2,低:1}[m[1]]}
  else if(m=take(/优先级(高|中|低)/)){prio={高:3,中:2,低:1}[m[1]]}
  else if(m=take(/\bP([123])\b/i)){prio={'1':3,'2':2,'3':1}[m[1].toLowerCase()]}
  if(prio)chips.push({k:'prio',v:{3:'高',2:'中',1:'低'}[prio],p:prio});
  return{text,chips,due,time,list,prio,repeat,tags};
}

/* ================= 解析器自测(浏览器地址加 ?selftest=1 自动运行) ================= */
function runParseTests(){
  const tests=[];const F=(cond,msg)=>tests.push(cond?null:msg);
  const wed=(()=>{const n=new Date();return addDays((3-n.getDay()+7)%7||7)})();
  const sat=(()=>{const n=new Date();return addDays((6-n.getDay()+7)%7||7)})();
  const nm5=(()=>{const n=new Date();return iso(new Date(n.getFullYear(),n.getMonth()+1,5))})();
  const day20=(()=>{const n=new Date();let d=new Date(n.getFullYear(),n.getMonth(),20);
    if(d<new Date(n.getFullYear(),n.getMonth(),n.getDate()))d=new Date(n.getFullYear(),n.getMonth()+1,20);return iso(d)})();
  let r;
  r=parseQuick('明天 14:00 写周报 #工作 !高');F(r.text==='写周报'&&r.due===addDays(1)&&r.time==='14:00'&&r.list==='work'&&r.prio===3,'标准全字段');
  r=parseQuick('今天 站会');F(r.due===TODAY&&r.text==='站会','今天');
  r=parseQuick('后天 复诊');F(r.due===addDays(2),'后天');
  r=parseQuick('交电费 20号');F(r.due===day20&&r.text==='交电费','X号(未来顺延)');
  r=parseQuick('99号 东西');F(r.due===null&&r.text==='99号 东西','X号越界不解析');
  r=parseQuick('2026-9-8 提交');F(r.due==='2026-09-08','ISO日期补零归一化');
  r=parseQuick('每周三健身');F(r.repeat==='weekly'&&r.due===wed&&r.text==='健身','每周X=重复+最近周三');
  r=parseQuick('每天背单词');F(r.repeat==='daily'&&r.text==='背单词','每天=每日重复');
  r=parseQuick('写周报！高优先级 #工作');F(r.prio===3&&r.list==='work'&&r.text==='写周报','全角!+高优先级');
  r=parseQuick('P1 修复bug');F(r.prio===3&&r.text==='修复bug','P1=高');
  r=parseQuick('下月5号 体检');F(r.due===nm5,'下月X号');
  r=parseQuick('周末大扫除');F(r.due===sat,'周末=最近周六');
  r=parseQuick('下午3点半 开会');F(r.time==='15:30'&&r.text==='开会','下午X点半');
  r=parseQuick('买牛奶');F(r.text==='买牛奶'&&!r.due&&!r.time&&!r.prio&&!r.repeat,'纯标题不被改动');
  const fails=tests.filter(Boolean);
  console[fails.length?'error':'log'](`parseQuick 自测: ${tests.length-fails.length}/${tests.length} 通过`,fails.length?fails:'');
  return fails;
}
if(location.search.includes('selftest'))runParseTests();

/* ================= 动作 ================= */
function nextOccur(due,repeat){
  const x=parseISO(due);
  if(repeat==='daily')x.setDate(x.getDate()+1);
  else if(repeat==='weekly')x.setDate(x.getDate()+7);
  else if(repeat==='monthly'){
    const d0=x.getDate(),nm=new Date(x.getFullYear(),x.getMonth()+1,1);
    nm.setDate(Math.min(d0,new Date(nm.getFullYear(),nm.getMonth()+1,0).getDate()));
    return iso(nm);
  }else if(repeat==='yearly'){
    const d0=x.getDate(),ny=new Date(x.getFullYear()+1,x.getMonth(),1);
    ny.setDate(Math.min(d0,new Date(ny.getFullYear(),ny.getMonth()+1,0).getDate()));
    return iso(ny);
  }
  return iso(x);
}
function toggleDone(id){
  const t=byId(id);if(!t)return;
  t.done=!t.done;t.doneAt=t.done?TODAY:null;
  if(t.done&&t.repeat){
    const nd=nextOccur(t.due||TODAY,t.repeat);
    tasks.push({id:seq++,title:t.title,list:t.list,tags:[...(t.tags||[])],prio:t.prio,due:nd,time:t.time,
      remind:t.remind,repeat:t.repeat,note:t.note,subs:(t.subs||[]).map(s=>({t:s.t,d:false})),done:false,doneAt:null});
    toast(`已完成,已生成下一次:${fmtDue(nd)}`);
  }
  if(t.done&&state.view!=='completed'){
    const row=document.querySelector(`[data-open="${id}"]`);
    if(row){row.classList.add('done');const cb=row.querySelector('.checkbox');cb&&cb.classList.add('checked');
      setTimeout(render,420);return}
  }
  render();
}
function deleteTask(id){
  const i=tasks.findIndex(t=>t.id===id);if(i<0)return;
  const[t]=tasks.splice(i,1);
  if(state.detailId===id)closeDetail();
  state.undo=t;render();
  toast(`已删除「${esc(t.title)}」`,()=>{tasks.push(t);state.undo=null;render()});
}
function moveTomorrow(id){const t=byId(id);if(!t)return;t.due=addDays(1);render();toast('已移到明天')}
function toast(msg,undoFn){
  const el=$('#toast');
  el.innerHTML=`<span>${msg}</span>${undoFn?'<button data-undo>撤销</button>':''}`;
  el.style.display='flex';
  if(undoFn)el.querySelector('[data-undo]').onclick=()=>{undoFn();el.style.display='none'};
  clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',undoFn?4500:2600);
}

  if(nav){state.view=nav.dataset.nav;closeDetail();render();return}
  if(e.target.closest('[data-settings]')){openSettings('appearance');return}
  if(e.target.closest('[data-addlist]')){
    state.addingList=!state.addingList;buildSidebar();
    if(state.addingList){const i=$('#newListInput');i&&i.focus();
      i&&(i.onkeydown=ev=>{if(ev.key==='Enter'&&i.value.trim()){
        LISTS.push({id:'c'+seq++,name:i.value.trim(),color:PALETTE[LISTS.length%PALETTE.length]});
        state.addingList=false;render();toast('清单已创建')}else if(ev.key==='Escape'){state.addingList=false;buildSidebar()}})}
    return}
  if(e.target.closest('[data-addtag]')){
    state.addingTag=!state.addingTag;buildSidebar();
    if(state.addingTag){const i=$('#newTagInput');i&&i.focus();
      i&&(i.onkeydown=ev=>{if(ev.key==='Enter'&&i.value.trim()){
        const tg=i.value.trim();
        if(tagList().includes(tg))toast('标签「'+esc(tg)+'」已存在');
        else{EXTRA_TAGS.push(tg);toast('标签「'+esc(tg)+'」已创建,可在任务详情中勾选')}
        state.addingTag=false;render()}else if(ev.key==='Escape'){state.addingTag=false;buildSidebar()}})}
    return}
  if(e.target.closest('[data-close-detail]')){closeDetail();render();return}
  if(e.target.closest('[data-win]')){
    const w=e.target.closest('[data-win]').dataset.win;
    toast(w==='close'?'这是设计原型,不会真的关闭窗口':(w==='min'?'已最小化(原型演示)':'已最大化(原型演示)'));
    return}
  const tg=e.target.closest('[data-toggle]');
  if(tg){e.stopPropagation();toggleDone(+tg.dataset.toggle);return}
  const mv=e.target.closest('[data-move]');if(mv){e.stopPropagation();moveTomorrow(+mv.dataset.move);return}
  const rs=e.target.closest('[data-restore]');if(rs){e.stopPropagation();toggleDone(+rs.dataset.restore);return}
  const dl=e.target.closest('[data-del]');if(dl){e.stopPropagation();deleteTask(+dl.dataset.del);return}
  if(state.detailId!=null){
    const pm=e.target.closest('[data-menu]');if(pm){propMenu(pm.dataset.menu,pm);return}
    const sb=e.target.closest('[data-sub]');if(sb){const t=byId(state.detailId);t.subs[+sb.dataset.sub].d=!t.subs[+sb.dataset.sub].d;render();return}
    const sd=e.target.closest('[data-subdel]');if(sd){const t=byId(state.detailId);t.subs.splice(+sd.dataset.subdel,1);render();return}
  }
  const cal=e.target.closest('[data-cal]');if(cal){state.calSel=cal.dataset.cal;buildMain();return}
  const cm=e.target.closest('[data-cm]');if(cm){state.calMonth.setMonth(state.calMonth.getMonth()+ +cm.dataset.cm);buildMain();return}
  if(e.target.closest('[data-cal-today]')){const n=new Date();state.calMonth=new Date(n.getFullYear(),n.getMonth(),1);state.calSel=TODAY;buildMain();return}
  const open=e.target.closest('[data-open]');
  if(open&&!e.target.closest('.checkbox,.row-btn,.kcard-meta'))openDetail(+open.dataset.open);
});
/* 看板拖拽 */
document.addEventListener('dragstart',e=>{const c=e.target.closest('.kcard');if(c){e.dataTransfer.setData('text/plain',c.dataset.drag);c.classList.add('dragging')}});
document.addEventListener('dragend',e=>{const c=e.target.closest('.kcard');c&&c.classList.remove('dragging');document.querySelectorAll('.kcol').forEach(k=>k.classList.remove('drag-over'))});
document.addEventListener('dragover',e=>{const col=e.target.closest('.kcol');if(col){e.preventDefault();col.classList.add('drag-over')}});
document.addEventListener('dragleave',e=>{const col=e.target.closest('.kcol');if(col&&!col.contains(e.relatedTarget))col.classList.remove('drag-over')});
document.addEventListener('drop',e=>{const col=e.target.closest('.kcol');if(!col)return;e.preventDefault();
  const id=+e.dataTransfer.getData('text/plain');const t=byId(id);
  if(t){t.prio=+col.dataset.drop||0;render();toast('已调整优先级')}});
/* 输入 */
document.addEventListener('input',e=>{
  if(e.target.id==='searchInput'){state.search=e.target.value;buildMain();return}
  if(e.target.id==='qaInput'){renderQaChips();return}
  const t=state.detailId!=null?byId(state.detailId):null;if(!t)return;
  if(e.target.dataset.field==='title')t.title=e.target.value;
  if(e.target.dataset.field==='note')t.note=e.target.value;
});
document.addEventListener('change',e=>{if(e.target.dataset.field){buildMain();buildSidebar()}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeMenu();closeHelp();const ov=document.getElementById('settingsOverlay');if(ov){closeSettings();return}if(state.detailId!=null){closeDetail();render()}return}
  const typing=/INPUT|TEXTAREA/.test(e.target.tagName);
  if(typing){
    if(e.target.id==='qaInput'&&e.key==='Enter'){e.preventDefault();quickAdd()}
    if(e.target.dataset.subadd&&e.key==='Enter'&&e.target.value.trim()){
      const t=byId(state.detailId);(t.subs=t.subs||[]).push({t:e.target.value.trim(),d:false});render()}
    if(e.target.id==='newListInput')return;

  }
  if(e.key==='n'){e.preventDefault();$('#qaInput').focus()}
  if(e.key==='/'){e.preventDefault();$('#searchInput').focus()}

/* ================= 设置弹窗 ================= */
const STABS=[{id:'appearance',n:'外观',i:'palette'},{id:'general',n:'通用',i:'sliders'},{id:'lists',n:'清单与标签',i:'list'},{id:'notify',n:'提醒',i:'bell'},{id:'data',n:'数据',i:'db'},{id:'about',n:'关于',i:'info'}];
let settingsTab='appearance';
let editState={mode:null,id:null,color:null};
function openSettings(tab){
  settingsTab=tab||settingsTab||'appearance';
  let ov=document.getElementById('settingsOverlay');
  if(!ov){
    ov=document.createElement('div');ov.id='settingsOverlay';ov.className='overlay';
    ov.innerHTML=`<div class="sdialog">
      <button class="icon-btn sclose" data-sclose title="关闭">${ic('x',15)}</button>
      <aside class="snav"><h2>设置</h2><div id="sNav"></div><div class="snav-foot">DoDo v0.1 · 设计原型</div></aside>
      <div class="scontent" id="sContent"></div></div>`;
    document.body.appendChild(ov);
    ov.addEventListener('click',settingsClick);
    ov.addEventListener('keydown',e=>{
      if(e.target.id!=='mEditInput')return;
      if(e.key==='Enter'){e.preventDefault();commitManage()}
      else if(e.key==='Escape'){e.stopPropagation();editState={mode:null,id:null,color:null};buildSettings()}
    });
  }
  buildSettings();
}
function closeSettings(){const ov=document.getElementById('settingsOverlay');if(ov)ov.remove()}
function saveSettings(){localStorage.setItem('dodo-settings',JSON.stringify(settings))}
function buildSettings(){
  const ov=document.getElementById('settingsOverlay');if(!ov)return;
  $('#sNav').innerHTML=STABS.map(t=>`<div class="snav-item ${settingsTab===t.id?'active':''}" data-stab="${t.id}">${ic(t.i,15.5)}<span>${t.n}</span></div>`).join('');
  const c=$('#sContent');
  if(settingsTab==='appearance'){
    const card=(mode,name,prev)=>`<div class="tcard ${settings.themeMode===mode?'active':''}" data-tmode="${mode}">
      <div class="prev ${prev}"><span class="bar" style="top:10px;width:56%"></span><span class="bar" style="top:20px;width:38%"></span><span class="bar" style="top:30px;width:46%"></span></div>
      <div class="tname">${name}<span class="m-check">${ic('checkS',14,2.4)}</span></div></div>`;
    c.innerHTML=`<h3>主题</h3><div class="sdesc">选择界面外观;「跟随系统」将随 Windows 深色模式自动切换</div>
      <div class="tcards">${card('light','亮色','prev-light')}${card('dark','暗色','prev-dark')}${card('auto','跟随系统','prev-auto')}</div>`;
  }else if(settingsTab==='general'){
    const sv=SMART.find(s=>s.id===settings.startView);
    c.innerHTML=`<h3>通用</h3><div class="sdesc">启动与本地化偏好</div>
      <div class="srow" data-ssel="startview"><div><div class="sl">启动时打开</div><div class="sd">应用启动后默认显示的视图</div></div><span class="sv">${sv?sv.name:'今天'}${ic('chevR',13)}</span></div>
      <div class="srow" data-ssel="weekstart"><div><div class="sl">一周起始日</div><div class="sd">影响日历视图的排列</div></div><span class="sv">${settings.weekStart==='mon'?'周一':'周日'}${ic('chevR',13)}</span></div>
      <div class="srow" data-ssel="timeformat"><div><div class="sl">时间格式</div><div class="sd">任务时刻的显示方式</div></div><span class="sv">${settings.timeFormat==='24'?'24 小时制':'12 小时制'}${ic('chevR',13)}</span></div>`;
  }else if(settingsTab==='notify'){
    c.innerHTML=`<h3>提醒</h3><div class="sdesc">桌面通知与默认提醒</div>
      <div class="srow"><div><div class="sl">桌面通知</div><div class="sd">任务到期时弹出 Windows 系统通知</div></div><button class="switch ${settings.notify?'on':''}" data-stoggle="notify" title="切换"></button></div>
      <div class="srow" data-ssel="defaultremind"><div><div class="sl">新任务默认提醒</div><div class="sd">快速添加的任务将自动使用该提醒时刻</div></div><span class="sv">${settings.defaultRemind?fmtTime(settings.defaultRemind):'不提醒'}${ic('chevR',13)}</span></div>`;
  }else if(settingsTab==='data'){
    c.innerHTML=`<h3>数据</h3><div class="sdesc">原型数据仅存于内存,刷新即还原;桌面版将使用本地 SQLite 持久化</div>
      <div class="srow" style="cursor:default"><div><div class="sl">导出任务</div><div class="sd">将当前清单与任务导出为 JSON 文件</div></div><button class="sbtn" data-sact="export">导出</button></div>
      <div class="srow" style="cursor:default"><div><div class="sl">恢复示例数据</div><div class="sd">清空当前改动,还原到打开时的演示数据</div></div><button class="sbtn danger" data-sact="reset">重置</button></div>`;
  }else if(settingsTab==='lists'){
    const lcnt=l=>tasks.filter(t=>!t.done&&t.list===l.id).length;
    const tcnt=tg=>tasks.filter(t=>!t.done&&(t.tags||[]).includes(tg)).length;
    const editRow=(kind,name,withColors)=>`<div class="medit">
      ${withColors?`<span class="cswatches">${PALETTE.map(p=>`<span class="csw ${editState.color===p?'on':''}" data-mcolor="${p}" style="background:${p}"></span>`).join('')}</span>`:ic('tag',15)}
      <input id="mEditInput" value="${esc(name)}" placeholder="${kind==='list'?'清单名称':'标签名称'}">
      <button class="sbtn" data-msave>保存</button><button class="sbtn" data-mcancel>取消</button></div>`;
    const listRows=LISTS.map(l=>{
      if(editState.mode==='list'&&editState.id===l.id)return editRow('list',l.name,true);
      return`<div class="mrow"><span class="dot" style="background:${l.color}"></span>
        <span class="mname">${esc(l.name)}</span><span class="mcount">${lcnt(l)} 项</span>
        <button class="row-btn" data-mact="edit" data-mkind="list" data-mid="${l.id}" title="编辑">${ic('edit',14)}</button>
        <button class="row-btn" data-mact="del" data-mkind="list" data-mid="${l.id}" title="删除">${ic('trash',14)}</button></div>`;
    }).join('');
    const tagRows=tagList().map(tg=>{
      if(editState.mode==='tag'&&editState.id===tg)return editRow('tag',tg,false);
      return`<div class="mrow">${ic('tag',15)}<span class="mname">${esc(tg)}</span><span class="mcount">${tcnt(tg)} 项</span>
        <button class="row-btn" data-mact="edit" data-mkind="tag" data-mid="${esc(tg)}" title="编辑">${ic('edit',14)}</button>
        <button class="row-btn" data-mact="del" data-mkind="tag" data-mid="${esc(tg)}" title="删除">${ic('trash',14)}</button></div>`;
    }).join('');
    const addRow=(kind,label)=>editState.mode===kind+'-new'?'':`<div class="madd" data-mact="add" data-mkind="${kind}">${ic('plus',13)}${label}</div>`;
    c.innerHTML=`<h3>清单</h3><div class="sdesc">删除清单时,其中任务将自动移入收件箱</div>
      <div class="mlist">${listRows}${editState.mode==='list-new'?editRow('list','',true):''}</div>${addRow('list','新增清单')}
      <h3 style="margin-top:20px">标签</h3><div class="sdesc">重命名会同步到所有任务;删除会从所有任务上移除</div>
      <div class="mlist">${tagRows}${editState.mode==='tag-new'?editRow('tag','',false):''}</div>${addRow('tag','新增标签')}`;
  }else{
    c.innerHTML=`<h3>关于</h3><div class="sdesc" style="margin-bottom:10px"></div>
      <div class="about-hero"><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg></div>
        <div><h4>DoDo <span style="font-weight:500;font-size:12px;color:var(--text-3)">v0.1 · 设计原型</span></h4><p>快速捕捉、清晰聚焦、赏心悦目的 Windows 桌面待办应用</p></div></div>
      <div class="srow" style="cursor:default"><span class="sl">技术预览</span></div>
      <div class="chiprow"><span class="stackchip">Tauri 2</span><span class="stackchip">Web 前端</span><span class="stackchip">本地 SQLite</span><span class="stackchip">Noto Sans SC</span></div>
      <p class="sdesc" style="margin-top:14px">美观确认通过后,将以本原型为视觉规范开发 Windows 桌面应用;数据仅存本地,无需注册登录。</p>`;
  }
  const ei=document.getElementById('mEditInput');
  if(ei)ei.focus();
}
function settingsClick(e){
  if(e.target.id==='settingsOverlay'){closeSettings();return}
  if(e.target.closest('[data-sclose]')){closeSettings();return}
  const tb=e.target.closest('[data-stab]');if(tb){settingsTab=tb.dataset.stab;buildSettings();return}
  const tm=e.target.closest('[data-tmode]');if(tm){settings.themeMode=tm.dataset.tmode;applyTheme();buildSettings();return}
  const tg=e.target.closest('[data-stoggle]');if(tg){const k=tg.dataset.stoggle;settings[k]=!settings[k];saveSettings();buildSettings();toast(settings[k]?'桌面通知已开启':'桌面通知已关闭');return}
  const sel=e.target.closest('[data-ssel]');if(sel){settingsMenu(sel);return}
  const mc=e.target.closest('[data-mcolor]');if(mc){editState.color=mc.dataset.mcolor;buildSettings();return}
  const mb=e.target.closest('[data-mact]');
  if(mb){
    const act=mb.dataset.mact,kind=mb.dataset.mkind,id=mb.dataset.mid;
    if(act==='add'){editState={mode:kind+'-new',id:null,color:PALETTE[LISTS.length%PALETTE.length]};buildSettings();return}
    if(act==='edit'){editState={mode:kind,id,color:(LISTS.find(x=>x.id===id)||{}).color};buildSettings();return}
    if(act==='del'){
      if(mb.dataset.arm){
        if(kind==='list'){
          const moved=tasks.filter(t=>t.list===id).length;
          tasks.forEach(t=>{if(t.list===id)t.list=null});
          LISTS=LISTS.filter(x=>x.id!==id);
          if(state.view==='list:'+id)state.view='today';
          if(state.detailId!=null)closeDetail();
          toast('清单已删除'+(moved?`,${moved} 个任务移入收件箱`:''));
        }else{
          deleteTag(id);toast('标签已删除');
        }
        editState={mode:null,id:null,color:null};buildSettings();render();
      }else{
        mb.dataset.arm='1';mb.classList.add('confirm');
        setTimeout(()=>{mb.dataset.arm='';mb.classList.remove('confirm')},2400);
      }
    }
    return;
  }
  if(e.target.closest('[data-msave]')){commitManage();return}
  if(e.target.closest('[data-mcancel]')){editState={mode:null,id:null,color:null};buildSettings();return}
  const act=e.target.closest('[data-sact]');if(act){
    const a=act.dataset.sact;
    if(a==='export'){exportData();return}
    if(a==='reset'){
      if(act.dataset.arm){resetDemo();closeSettings()}
      else{act.dataset.arm='1';act.textContent='再点一次确认';
        setTimeout(()=>{act.dataset.arm='';if(act.isConnected)act.textContent='重置'},2600)}
    }
  }
}
function settingsMenu(anchor){
  const key=anchor.dataset.ssel;let items,apply;
  if(key==='startview'){
    items=SMART.map(s=>({v:s.id,label:s.name,icon:s.icon,active:settings.startView===s.id}));
    apply=v=>{settings.startView=v;state.view=v};
  }else if(key==='weekstart'){
    items=[{v:'mon',label:'周一',active:settings.weekStart==='mon'},{v:'sun',label:'周日',active:settings.weekStart==='sun'}];
    apply=v=>{settings.weekStart=v};
  }else if(key==='timeformat'){
    items=[{v:'24',label:'24 小时制',active:settings.timeFormat==='24'},{v:'12',label:'12 小时制',active:settings.timeFormat==='12'}];
    apply=v=>{settings.timeFormat=v};
  }else if(key==='defaultremind'){
    items=[{v:'__none',label:'不提醒',icon:'x',active:!settings.defaultRemind},
      {v:'09:00',label:'当天 09:00',icon:'bell',active:settings.defaultRemind==='09:00'},
      {v:'12:00',label:'当天 12:00',icon:'bell',active:settings.defaultRemind==='12:00'},
      {v:'21:00',label:'前一天 21:00',icon:'bell',active:settings.defaultRemind==='21:00'}];
    apply=v=>{settings.defaultRemind=v==='__none'?null:v};
  }else return;
  openMenu(anchor,menuHTML(items),m=>m.addEventListener('click',e=>{
    const mi=e.target.closest('[data-mi]');if(!mi)return;
    apply(mi.dataset.mi);saveSettings();buildSettings();render();
  }));
}
function renameTag(old,nv){
  EXTRA_TAGS=EXTRA_TAGS.map(t=>t===old?nv:t);
  tasks.forEach(t=>{t.tags=(t.tags||[]).map(x=>x===old?nv:x)});
  if(state.view==='tag:'+old)state.view='tag:'+nv;
}
function deleteTag(tg){
  EXTRA_TAGS=EXTRA_TAGS.filter(t=>t!==tg);
  tasks.forEach(t=>{t.tags=(t.tags||[]).filter(x=>x!==tg)});
  if(state.view==='tag:'+tg)state.view='today';
}
function commitManage(){
  const inp=document.getElementById('mEditInput');
  const nv=(inp?inp.value:'').trim();
  const es=editState;
  if(!nv){toast('名称不能为空');return}
  if(es.mode==='list-new'){
    if(LISTS.some(l=>l.name===nv)){toast('清单「'+esc(nv)+'」已存在');return}
    LISTS.push({id:'c'+seq++,name:nv,color:es.color||PALETTE[0]});
    toast('清单「'+esc(nv)+'」已创建');
  }else if(es.mode==='list'){
    const l=LISTS.find(x=>x.id===es.id);
    if(LISTS.some(x=>x!==l&&x.name===nv)){toast('清单「'+esc(nv)+'」已存在');return}
    l.name=nv;l.color=es.color||l.color;
    toast('清单已更新');
  }else if(es.mode==='tag-new'){
    if(tagList().includes(nv)){toast('标签「'+esc(nv)+'」已存在');return}
    EXTRA_TAGS.push(nv);
    toast('标签「'+esc(nv)+'」已创建');
  }else{
    if(tagList().some(x=>x!==es.id&&x===nv)){toast('标签「'+esc(nv)+'」已存在');return}
    renameTag(es.id,nv);
    toast('标签已更新');
  }
  editState={mode:null,id:null,color:null};buildSettings();render();
}
function exportData(){
  try{
    const blob=new Blob([JSON.stringify({app:'DoDo',exportedAt:new Date().toISOString(),lists:LISTS,tasks},null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dodo-export.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    toast('已导出 dodo-export.json');
  }catch(err){toast('导出受限:当前环境不支持下载')}
}
function resetDemo(){
  tasks=JSON.parse(JSON.stringify(SAMPLE));
  state.detailId=null;render();toast('已恢复示例数据');
}

/* ================= 启动 ================= */
if(SMART.some(s=>s.id===settings.startView))state.view=settings.startView;
applyTheme();
render();
function render(){TODAY=iso(new Date());buildSidebar();buildMain();buildDetail()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});
</script>
